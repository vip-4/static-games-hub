# Cloudflare Pages configuration.
# Deploy:  npx wrangler@latest pages deploy dist --project-name=openarc
# Auth comes from CLOUDFLARE_API_TOKEN (env) or `wrangler login` — never from this file.
# Note: `wrangler pages deploy` uploads a PRE-BUILT `dist/` directory, so no [build]
# section belongs here (that would fail Pages config validation). The site is built
# by scripts/build.py in CI before deploy.

name = "openarc"
compatibility_date = "2026-01-01"
pages_build_output_dir = "dist"
