  <script type="application/ld+json">

  <link rel="stylesheet" href="/assets/css/style.css" />
  <style>
    .stage { display: grid; place-items: center; gap: 10px; padding: 16px 0; }
    canvas { background: #0c0e22; border: 2px solid #343a72; border-radius: 12px; max-width: 100%; }
    .hint, .status { text-align: center; color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="site-header">
    <a class="brand" href="/">🎮 OpenArc</a>
    <nav aria-label="Primary"><a href="/games.html">Games</a></nav>
  </header>
  <main id="main">
    <section class="stage" aria-labelledby="t">
      <h1 id="t">Pong</h1>
      <p class="hint">Move with Arrow keys / W·S or the mouse · Space starts · first to 5 wins</p>
      <p class="status" id="status" role="status" aria-live="polite">Press Space to start</p>
      <canvas id="c" width="480" height="320" aria-label="Pong playfield"></canvas>
      <button class="btn" id="new">New game</button>
    </section>
      <!--GAME_CONTENT-->
  </main>
  <script>
    const cv = document.getElementById("c"), ctx = cv.getContext("2d");
    const statusEl = document.getElementById("status");
    const PH = 62, PW = 8, WIN = 5;
    let p, ai, ball, ps, as, running, started;

    function reset() {
      p = { y: (cv.height - PH) / 2 };
      ai = { y: (cv.height - PH) / 2 };
      ball = { x: cv.width / 2, y: cv.height / 2, vx: 3.2, vy: 1.6, r: 6 };
      ps = 0; as = 0; running = false; started = false;
      statusEl.textContent = "Press Space to start";
      draw();
    }
    function draw() {
      ctx.fillStyle = "#0c0e22"; ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.strokeStyle = "#2a2f5a"; ctx.setLineDash([6, 8]);
      ctx.beginPath(); ctx.moveTo(cv.width / 2, 0); ctx.lineTo(cv.width / 2, cv.height); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = "#7ee0ff"; ctx.fillRect(12, p.y, PW, PH);
      ctx.fillStyle = "#ff9ab0"; ctx.fillRect(cv.width - 20, ai.y, PW, PH);
      ctx.fillStyle = "#ffd24a";
      ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#b3b9e0"; ctx.font = "20px system-ui";
      ctx.fillText(String(ps), cv.width / 2 - 40, 30);
      ctx.fillText(String(as), cv.width / 2 + 28, 30);
    }
    function tick() {
      if (!running) return;
      ball.x += ball.vx; ball.y += ball.vy;
      if (ball.y - ball.r < 0 || ball.y + ball.r > cv.height) ball.vy *= -1;

      // player paddle
      if (ball.x - ball.r < 20 && ball.y > p.y && ball.y < p.y + PH && ball.vx < 0) {
        ball.vx = Math.abs(ball.vx) * 1.03;
        ball.vy += (ball.y - (p.y + PH / 2)) * 0.12;
      }
      // AI paddle (simple tracking)
      const target = ball.y - PH / 2;
      ai.y += Math.max(-3.4, Math.min(3.4, target - ai.y));
      ai.y = Math.max(0, Math.min(cv.height - PH, ai.y));
      if (ball.x + ball.r > cv.width - 20 && ball.y > ai.y && ball.y < ai.y + PH && ball.vx > 0) {
        ball.vx = -Math.abs(ball.vx) * 1.03;
        ball.vy += (ball.y - (ai.y + PH / 2)) * 0.12;
      }

      if (ball.x < 0) { as++; point(); }
      else if (ball.x > cv.width) { ps++; point(); }
      else { statusEl.textContent = `You ${ps} · AI ${as}`; draw(); }
    }
    function point() {
      if (ps >= WIN || as >= WIN) {
        running = false;
        statusEl.textContent = ps >= WIN ? `You win ${ps}–${as}! Press Space to replay.`
                                         : `AI wins ${as}–${ps}. Press Space to replay.`;
        draw(); return;
      }
      ball.x = cv.width / 2; ball.y = cv.height / 2;
      ball.vx = (Math.random() < 0.5 ? -1 : 1) * 3.2; ball.vy = 1.6;
      statusEl.textContent = `You ${ps} · AI ${as}`;
      draw();
    }
    function startPause() {
      if (!started) { started = true; running = true; statusEl.textContent = "Playing"; }
      else running = !running;
    }
    addEventListener("keydown", e => {
      if (e.key === " ") { e.preventDefault(); startPause(); }
      const k = e.key.toLowerCase();
      if (e.key === "ArrowUp" || k === "w") p.y = Math.max(0, p.y - 24);
      if (e.key === "ArrowDown" || k === "s") p.y = Math.min(cv.height - PH, p.y + 24);
    });
    cv.addEventListener("mousemove", e => {
      const r = cv.getBoundingClientRect();
      p.y = Math.max(0, Math.min(cv.height - PH, (e.clientY - r.top) * (cv.height / r.height) - PH / 2));
    });
    document.getElementById("new").addEventListener("click", reset);
    reset(); setInterval(tick, 16);
  </script>
</body>
</html>
