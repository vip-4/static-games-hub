   "description":"Classic Snake: eat, grow and avoid the wall. A dependency-free static HTML5 game.",
   "url":"https://openarc.example.com/play/snake.html","genre":"Arcade",

  <link rel="stylesheet" href="/assets/css/style.css" />
  <style>
    .stage { display: grid; place-items: center; gap: 12px; padding: 24px 0; }
    canvas { background: #0c0e22; border: 2px solid #343a72; border-radius: 12px; }
    .hint { color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="site-header">
    <a class="brand" href="/">🎮 OpenArc</a>
    <nav aria-label="Primary"><a href="/games.html">Games</a></nav>
  </header>
  <main id="main">
    <section class="stage" aria-labelledby="t">
      <h1 id="t">Snake</h1>
      <canvas id="c" width="320" height="320" aria-label="Snake game"></canvas>
      <p class="hint">Arrow keys or WASD to move. Press Space to restart.</p>
      <p class="hint" role="status" aria-live="polite">Score: <span id="score">0</span></p>
    </section>
      <!--GAME_CONTENT-->
  </main>
  <script>
    const cv = document.getElementById("c"), ctx = cv.getContext("2d");
    const N = 16, S = cv.width / N;
    let snake, dir, food, score, over;
    function reset() {
      snake = [{x:8,y:8}]; dir = {x:1,y:0}; score = 0; over = false;
      placeFood(); document.getElementById("score").textContent = 0;
    }
    function placeFood() {
      do { food = {x:(Math.random()*N)|0, y:(Math.random()*N)|0}; }
      while (snake.some(s => s.x===food.x && s.y===food.y));
    }
    function step() {
      if (over) return;
      const head = {x: snake[0].x+dir.x, y: snake[0].y+dir.y};
      if (head.x<0||head.y<0||head.x>=N||head.y>=N||snake.some(s=>s.x===head.x&&s.y===head.y)) { over = true; return; }
      snake.unshift(head);
      if (head.x===food.x && head.y===food.y) { score++; document.getElementById("score").textContent = score; placeFood(); }
      else snake.pop();
    }
    function draw() {
      ctx.fillStyle = "#0c0e22"; ctx.fillRect(0,0,cv.width,cv.height);
      ctx.fillStyle = "#ffd24a"; ctx.fillRect(food.x*S, food.y*S, S-1, S-1);
      ctx.fillStyle = over ? "#ff5da2" : "#5dd6ff";
      snake.forEach(s => ctx.fillRect(s.x*S, s.y*S, S-1, S-1));
    }
    function loop() { step(); draw(); }
    addEventListener("keydown", e => {
      const k = e.key.toLowerCase();
      if (k===" " && over) return reset();
      if (k==="arrowup"||k==="w") dir={x:0,y:-1};
      else if (k==="arrowdown"||k==="s") dir={x:0,y:1};
      else if (k==="arrowleft"||k==="a") dir={x:-1,y:0};
      else if (k==="arrowright"||k==="d") dir={x:1,y:0};
    });
    reset(); setInterval(loop, 110);
  </script>
</body>
</html>
